services:
  db:
    image: pgvector/pgvector:pg16
    container_name: cctv_pg
    environment:
      POSTGRES_USER: cctv
      POSTGRES_PASSWORD: cctv
      POSTGRES_DB: cctv
    ports:
      - "5432:5432"
    volumes:
      - cctv_pgdata:/var/lib/postgresql/data
      # Runs ONCE on first init of an empty data volume.
      - ./schema.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cctv -d cctv"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cctv_pgdata:
